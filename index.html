<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#274c3b">
  <meta name="description" content="달마다 만나는 제철 재료로 오늘의 메뉴를 골라보세요.">
  <title>오늘 뭐먹지? · 제철 식탁</title>
  <style>
    :root{--paper:#f8f7f2;--ink:#243f32;--muted:#72766c;--line:#dedfd3;--green:#325842;--pale:#e9eddf;--accent:#c4d683}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}button,select{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a07837;outline-offset:4px}[hidden]{display:none!important}
    .wrap{width:min(1160px,calc(100% - 64px));margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 0;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;gap:10px}.mark{width:30px;height:30px;background:var(--green);border-radius:50% 50% 45% 45%;display:grid;place-items:center;color:var(--paper);font-size:19px}.header-note,.eyebrow{font-size:11px;letter-spacing:2.4px;font-weight:700}.header-note{color:var(--muted)}
    .hero{padding:58px 0 40px;display:flex;align-items:center;justify-content:space-between;gap:32px}.eyebrow{color:#6e8055;margin:0 0 14px}.hero h1{font-size:clamp(34px,4.2vw,52px);line-height:1.3;letter-spacing:-2.5px;margin:0 0 17px;font-weight:700}.hero h1 em{font-style:normal;color:#819456}.intro{color:var(--muted);font-size:15px;margin:0}.month-control{min-width:200px;padding:23px 25px;background:#eff0e6;border:1px solid var(--line);border-radius:16px}.month-control label{display:block;font-size:12px;margin-bottom:10px;color:#626d58}.select-wrap{position:relative}.select-wrap:after{content:'⌄';position:absolute;right:1px;top:0;pointer-events:none;font-size:25px}select{appearance:none;width:100%;border:0;border-bottom:1px solid #adb69c;background:transparent;color:var(--ink);font-size:28px;font-weight:700;padding:0 30px 8px 0;border-radius:0}
    .ingredients-panel{padding:25px 28px 28px;background:#fffef9;border:1px solid var(--line);border-radius:16px}.section-label{display:flex;align-items:center;gap:10px;margin-bottom:17px}.step{font-size:10px;font-weight:700;letter-spacing:1px;border:1px solid #bac5a7;border-radius:5px;padding:1px 6px;color:#6a7e51}.section-label h2{margin:0;font-size:17px;letter-spacing:-.5px}.hint{margin-left:auto;font-size:12px;color:var(--muted)}.ingredients{display:flex;flex-wrap:wrap;gap:10px}.ingredient{border:1px solid var(--line);border-radius:50px;padding:9px 18px;background:transparent;color:#5c6454;display:flex;gap:9px;align-items:center;transition:background .18s,transform .18s}.ingredient:hover{background:var(--pale);transform:translateY(-2px)}.ingredient[aria-pressed=true]{color:white;background:var(--green);border-color:var(--green)}.ingredient .count{font-size:11px;opacity:.65}.ingredient[aria-pressed=true]:before{content:'✓';font-size:12px}
    .recipes-section{padding:38px 0 65px}.results-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:21px}.results-header h2{font-size:23px;letter-spacing:-1px;margin:0}.results-header h2 span{color:#819456}.result-count{font-size:12px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:27px 24px}.card{background:#fffefa;border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 22px #243f320c}.photo{position:relative;aspect-ratio:1.62;background:#e9e9df;overflow:hidden;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.card:hover img{transform:scale(1.035)}.photo .fallback{display:none;color:#7c846d;font-size:13px;text-align:center}.photo.failed .fallback{display:block}.photo.failed img{display:none}.season-tag{position:absolute;left:14px;top:14px;background:#fffef4ee;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700}.card-body{padding:18px 20px 19px}.category{font-size:11px;color:#6e8055;margin-bottom:6px;display:flex;gap:7px;align-items:center}.category:before{content:'';width:5px;height:5px;background:#8b9b65;border-radius:50%}.card h3{font-size:18px;line-height:1.5;letter-spacing:-.6px;margin:0;overflow-wrap:anywhere}.card-meta{margin:13px 0 0;padding-top:12px;border-top:1px solid #eeeee5;display:flex;justify-content:space-between;gap:12px;color:#848777;font-size:11px}.status{padding:60px 20px;text-align:center;border:1px dashed #cbd1be;border-radius:14px;background:#eff0e633}.status-icon{font-size:30px;margin:0 0 10px}.status h3{font-size:19px;margin:0 0 7px}.status p{color:var(--muted);font-size:14px;margin:0}.retry{margin-top:18px;border:0;border-radius:30px;padding:10px 22px;background:var(--green);color:white}.footer{border-top:1px solid var(--line);padding:22px 0 28px;display:flex;justify-content:space-between;gap:16px;font-size:11px;color:#858979}.footer a{color:inherit;text-decoration:underline;text-underline-offset:3px}
    @media(min-width:1100px){.hero:after{content:'✳';font-size:116px;line-height:1;color:#cbd3b4;order:1;margin:0 auto}.month-control{order:2}.hero-copy{flex-shrink:0}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    @media(max-width:760px){.wrap{width:calc(100% - 36px)}header{padding:20px 0}.header-note{font-size:9px;letter-spacing:1px}.hero{padding:35px 0 28px;align-items:flex-start;flex-direction:column;gap:24px}.hero h1{letter-spacing:-1.7px}.intro{font-size:14px}.month-control{width:100%;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.month-control label{margin:0}.select-wrap{min-width:100px}select{font-size:23px}.ingredients-panel{padding:20px}.hint{display:none}.ingredient{padding:8px 14px;font-size:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card-body{padding:14px}.card h3{font-size:16px}.results-header h2{font-size:20px}.season-tag{left:9px;top:9px}.footer{flex-direction:column;gap:4px}}
    @media(max-width:440px){.grid{grid-template-columns:1fr}.photo{aspect-ratio:1.65}.card h3{font-size:18px}.card-body{padding:17px 19px}.brand{font-size:18px}.header-note{display:none}.results-header{gap:10px}.result-count{font-size:11px}}
    .photo{aspect-ratio:4/3;background:#f0efe7}
    .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block}
    .card:hover img{transform:none}
    .photo .fallback{position:relative;z-index:1;padding:18px}
    .photo .fallback p{margin:0 0 10px;font-size:13px}
    .image-retry{border:1px solid #a9b598;border-radius:20px;background:#fffef9;color:var(--ink);padding:7px 14px;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="brand"><span class="mark" aria-hidden="true">♧</span>오늘 뭐먹지?</div><span class="header-note">A LITTLE SEASON ON YOUR TABLE</span></header>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy"><p class="eyebrow">MONTHLY SEASONAL TABLE</p><h1 id="hero-title">오늘의 고민,<br><em>제철 한 끼</em>로 가볍게.</h1><p class="intro">계절이 건네는 재료로, 오늘의 식탁을 골라보세요.</p></div>
        <div class="month-control"><label for="month">어느 달의 식탁을 만나볼까요?</label><div class="select-wrap"><select id="month" aria-label="제철 재료를 확인할 월"></select></div></div>
      </section>
      <section class="ingredients-panel" aria-labelledby="ingredients-title" aria-busy="true" id="ingredients-panel">
        <div class="section-label"><span class="step">01</span><h2 id="ingredients-title">이달의 제철 재료</h2><span class="hint">먹고 싶은 재료를 하나 골라주세요</span></div>
        <div class="ingredients" id="ingredients"><span class="intro">제철 재료를 불러오는 중이에요…</span></div>
      </section>
      <section class="recipes-section" aria-labelledby="results-title">
        <div class="results-header"><h2 id="results-title">오늘의 추천 메뉴</h2><span class="result-count" id="result-count" role="status" aria-live="polite"></span></div>
        <div id="recipes" class="grid"></div>
        <div id="status" class="status" role="status"><div class="status-icon" aria-hidden="true">♧</div><h3 id="status-title">계절의 맛을 가져오고 있어요</h3><p id="status-description">잠시만 기다려주세요.</p><button type="button" class="retry" id="retry" hidden>다시 불러오기</button><button type="button" class="retry" id="choose-file" hidden>menu.json 선택하기</button><input type="file" id="menu-file" accept=".json,application/json" hidden></div>
      </section>
    </main>
    <footer class="footer"><span>오늘 뭐먹지? · 계절을 담은 소박한 식탁</span><span>레시피·사진 출처 <a href="https://www.foodsafetykorea.go.kr" target="_blank" rel="noopener noreferrer">식품안전나라 ↗</a></span></footer>
  </div>
  <script>
    'use strict';
    const monthSelect = document.querySelector('#month');
    const ingredients = document.querySelector('#ingredients');
    const recipes = document.querySelector('#recipes');
    const statusBox = document.querySelector('#status');
    const retry = document.querySelector('#retry');
    const chooseFile = document.querySelector('#choose-file');
    const menuFile = document.querySelector('#menu-file');
    let data = { seasonal: [], recipes: [] };
    let selectedIngredient = null;
    for (let month = 1; month <= 12; month++) {
      const option = document.createElement('option');
      option.value = month;
      option.textContent = `${month}월`;
      monthSelect.append(option);
    }
    monthSelect.value = new Date().getMonth() + 1;
    function matchingRecipes(name) {
      const month = Number(monthSelect.value);
      return data.recipes.filter(recipe => recipe.seasonal.includes(name) && recipe.months.includes(month));
    }
    function showStatus(title, description) {
      statusBox.hidden = false;
      document.querySelector('#status-title').textContent = title;
      document.querySelector('#status-description').textContent = description;
    }
    function renderIngredients() {
      const month = Number(monthSelect.value);
      const names = [...new Set(data.seasonal.filter(item => item.month === month).map(item => item.name))];
      selectedIngredient = null;
      ingredients.replaceChildren();
      document.querySelector('#ingredients-title').textContent = `${month}월의 제철 재료`;
      for (const name of names) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'ingredient';
        button.setAttribute('aria-pressed', 'false');
        button.append(document.createTextNode(name));
        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = matchingRecipes(name).length;
        button.append(count);
        button.addEventListener('click', () => {
          selectedIngredient = name;
          for (const other of ingredients.querySelectorAll('button')) other.setAttribute('aria-pressed', String(other === button));
          renderRecipes();
        });
        ingredients.append(button);
      }
      if (!names.length) ingredients.textContent = '이달에 등록된 제철 재료가 없어요.';
      renderRecipes();
    }
    function renderRecipes() {
      recipes.replaceChildren();
      retry.hidden = true;
      const title = document.querySelector('#results-title');
      const counter = document.querySelector('#result-count');
      if (!selectedIngredient) {
        title.textContent = '오늘의 추천 메뉴';
        counter.textContent = '재료를 선택하면 메뉴가 보여요';
        showStatus('어떤 재료가 끌리세요?', '위에서 제철 재료를 골라 오늘의 메뉴를 만나보세요.');
        return;
      }
      const matches = matchingRecipes(selectedIngredient);
      title.replaceChildren();
      const highlight = document.createElement('span');
      highlight.textContent = selectedIngredient;
      title.append(highlight, document.createTextNode('로 차리는 한 끼'));
      counter.textContent = `${monthSelect.value}월 · 총 ${matches.length}개의 메뉴`;
      statusBox.hidden = matches.length > 0;
      if (!matches.length) {
        showStatus('아직 등록된 메뉴가 없어요', '선택한 월과 재료에 맞는 레시피가 없어요. 다른 재료를 골라보세요.');
        return;
      }
      for (const recipe of matches) {
        const card = document.createElement('article');
        card.className = 'card';
        const photo = document.createElement('div');
        photo.className = 'photo';
        const image = document.createElement('img');
        image.alt = recipe.name;
        image.loading = 'lazy';
        image.decoding = 'async';
        image.referrerPolicy = 'no-referrer';
        const fallback = document.createElement('div');
        fallback.className = 'fallback';
        const imageMessage = document.createElement('p');
        imageMessage.textContent = '사진을 불러오지 못했어요';
        const imageRetry = document.createElement('button');
        imageRetry.type = 'button';
        imageRetry.className = 'image-retry';
        imageRetry.textContent = '사진 다시 불러오기';
        imageRetry.setAttribute('aria-label', `${recipe.name} 사진 다시 불러오기`);
        fallback.append(imageMessage, imageRetry);
        let imageUrl = null;
        image.addEventListener('load', () => photo.classList.remove('failed'));
        image.addEventListener('error', () => photo.classList.add('failed'));
        imageRetry.addEventListener('click', () => {
          if (!imageUrl) return;
          const url = new URL(imageUrl);
          url.searchParams.set('_retry', Date.now());
          photo.classList.remove('failed');
          image.src = url.href;
        });
        try {
          // This recipe's supplied URL points to the home page. Use its final cooking-step photo.
          const source = Number(recipe.id) === 745 && recipe.image === 'https://www.foodsafetykorea.go.kr/'
            ? 'https://www.foodsafetykorea.go.kr/uploadimg/cook/745-6.jpg' : recipe.image;
          const url = new URL(source);
          if (!['https:', 'http:'].includes(url.protocol)) throw new Error('Invalid image URL');
          imageUrl = url.href;
          image.src = imageUrl;
        } catch {
          photo.classList.add('failed');
          imageMessage.textContent = '등록된 사진 주소를 확인할 수 없어요';
          imageRetry.hidden = true;
        }
        const tag = document.createElement('span');
        tag.className = 'season-tag';
        tag.textContent = `${monthSelect.value}월 제철`;
        photo.append(image, fallback, tag);
        const body = document.createElement('div');
        body.className = 'card-body';
        const category = document.createElement('div');
        category.className = 'category';
        category.textContent = recipe.category || '기타';
        const name = document.createElement('h3');
        name.textContent = recipe.name;
        const meta = document.createElement('div');
        meta.className = 'card-meta';
        const ingredient = document.createElement('span');
        ingredient.textContent = `제철 재료 · ${selectedIngredient}`;
        const method = document.createElement('span');
        method.textContent = recipe.method || '';
        meta.append(ingredient, method);
        body.append(category, name, meta);
        card.append(photo, body);
        recipes.append(card);
      }
    }
    async function loadData(source = './menu.json') {
      retry.hidden = true;
      chooseFile.hidden = true;
      monthSelect.disabled = true;
      document.querySelector('#ingredients-panel').setAttribute('aria-busy', 'true');
      showStatus('계절의 맛을 가져오고 있어요', '잠시만 기다려주세요.');
      try {
        const response = await fetch(source);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        if (!Array.isArray(json.seasonal) || !Array.isArray(json.recipes) ||
            !json.seasonal.every(item => item && Number.isInteger(item.month) && typeof item.name === 'string') ||
            !json.recipes.every(item => item && typeof item.name === 'string' && Array.isArray(item.seasonal) && Array.isArray(item.months))) {
          throw new Error('Invalid menu data');
        }
        data = json;
        renderIngredients();
      } catch (error) {
        ingredients.textContent = '재료 목록을 불러오지 못했어요.';
        recipes.replaceChildren();
        document.querySelector('#result-count').textContent = '';
        showStatus('메뉴 파일을 선택해주세요', location.protocol === 'file:' ? '아래 버튼을 누르고 같은 폴더에 있는 menu.json을 선택하면 바로 시작할 수 있어요.' : '자동으로 불러오지 못했어요. 다시 시도하거나 menu.json을 직접 선택해주세요.');
        chooseFile.hidden = false;
        retry.hidden = location.protocol === 'file:';
        console.error('menu.json loading failed:', error);
      } finally {
        monthSelect.disabled = false;
        document.querySelector('#ingredients-panel').setAttribute('aria-busy', 'false');
      }
    }
    monthSelect.addEventListener('change', () => {
      if (data.seasonal.length) renderIngredients();
    });
    retry.addEventListener('click', () => loadData());
    chooseFile.addEventListener('click', () => menuFile.click());
    menuFile.addEventListener('change', async () => {
      const file = menuFile.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      try { await loadData(url); }
      finally { URL.revokeObjectURL(url); menuFile.value = ''; }
    });
    if (location.protocol === 'file:') {
      ingredients.textContent = 'menu.json을 선택하면 이달의 재료가 표시돼요.';
      document.querySelector('#ingredients-panel').setAttribute('aria-busy', 'false');
      showStatus('메뉴 파일을 선택해주세요', '아래 버튼을 누르고 같은 폴더에 있는 menu.json을 선택하면 바로 시작할 수 있어요.');
      chooseFile.hidden = false;
    } else {
      loadData();
    }
  </script>
</body>
</html>
